# Render Blueprint for the admin: a static site (free, served from a CDN).
# https://render.com/docs/blueprint-spec
#
# After the first deploy, add this site's URL (for example
# https://bota-review-admin.onrender.com) to the API service's
# ALLOWED_ORIGINS and CLERK_AUTHORIZED_PARTIES, comma-separated, or every
# request is refused.

services:
  - name: bota-review-admin
    type: web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: false
    envVars:
      # e.g. https://bota-review-api.onrender.com/v1
      - key: VITE_API_URL
        sync: false
      # The production publishable key (pk_live_…) from the Clerk dashboard.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    # Client-side routing: every path serves the app.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # File names carry a content hash, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Always check for a new build.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
